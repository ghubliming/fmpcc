[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fmpcc"
version = "1.0.0"
description = "Flow-matching predictive control with constraint projection"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["fmpcc*"]

[tool.setuptools.package-data]
"*" = ["*.xml", "*.stl", "*.obj", "*.png", "*.urdf", "*.gin", "LICENSE*", "*.pkl"]
